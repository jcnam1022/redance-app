<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ReDance 회비 관리</title>

  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1DxFdq_PN3t9P5FFwR44eDP9plOBZAvY6" />
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1DxFdq_PN3t9P5FFwR44eDP9plOBZAvY6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ReDance" />

  <style>
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #1e3a5f; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .box {
      background: #fff; color: #0f172a; border-radius: 16px; padding: 24px;
      max-width: 360px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 12px; object-fit: cover; }
    h2 { margin: 0 0 8px 0; font-size: 18px; }
    p { margin: 0 0 18px 0; font-size: 13px; color: #64748b; line-height: 1.5; }
    a.btn {
      display: block; background: #1e3a5f; color: #fff; text-decoration: none;
      padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="https://lh3.googleusercontent.com/d/1DxFdq_PN3t9P5FFwR44eDP9plOBZAvY6" alt="ReDance" />
    <h2>ReDance 회비 관리</h2>
    <a id="openBtn" class="btn" href="#">웹 앱 바로 열기 →</a>
  </div>

  <script>
    const WEBAPP_URL = "여기에_최신_Apps_Script_웹앱_URL_붙여넣기";
    document.getElementById("openBtn").href = WEBAPP_URL;

    if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
      window.location.replace(WEBAPP_URL);
    }
  </script>
</body>
</html>
