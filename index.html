<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ReDance 회비 관리</title>

  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1DxFdq_PN3t9P5FFwR44eDP9plOBZAvY6" />
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1DxFdq_PN3t9P5FFwR44eDP9plOBZAvY6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ReDance" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #1e3a5f; color: #fff;
    }
    .wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .box {
      background: #fff; color: #0f172a; border-radius: 16px; padding: 28px 24px;
      max-width: 340px; width: 100%; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.22);
      display: flex; flex-direction: column; align-items: center;
    }
    img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 14px; object-fit: cover; display: block; }
    h2 { margin: 0 0 18px 0; font-size: 18px; }
    a.btn {
      display: block; width: 100%; background: #1e3a5f; color: #fff; text-decoration: none;
      padding: 13px; border-radius: 10px; font-weight: 700; font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <img src="https://lh3.googleusercontent.com/d/1DxFdq_PN3t9P5FFwR44eDP9plOBZAvY6" alt="ReDance" />
      <h2>ReDance 회비 관리</h2>
      <a id="openBtn" class="btn" href="#">웹앱 열기 →</a>
    </div>
  </div>

  <script>
    // 반드시 https:// 로 시작하는 전체 URL을 넣어주세요
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzPRCu4uYBOrb7FLA-bVyDdd0IrEREABna__XSn3ZwP0HtbWDs89dLh6YsDLI04xDjO/exec";
    document.getElementById("openBtn").href = WEBAPP_URL;

    if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
      window.location.replace(WEBAPP_URL);
    }
  </script>
</body>
</html>
